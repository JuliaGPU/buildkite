# gpuci has 2 AMD EPYC 7402 CPUs, 48 threads in total, with 504GB of RAM
#
# This agent shares its RTX 5000 with gpuci.15. CI jobs are mostly compile-bound
# and leave the GPU idle, and 16GB of VRAM fits two jobs. The lower priority
# makes jobs prefer agents with a dedicated GPU.

services:
  buildkite:
    hostname: gpuci.18
    build:
      context: ../../image/
      args:
        base: nvidia/cuda:13.3.0-devel-ubuntu24.04
    runtime: nvidia
    environment:
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      NVIDIA_VISIBLE_DEVICES: "GPU-1b7ad372-8d21-b239-ce32-63449f713690"
      JULIA_CPU_THREADS: 2
      LD_LIBRARY_PATH: ""
    pid: "host" #  NVIDIA/gpu-monitoring-tools#63
    env_file: ../token.env
    command:
      - start
      - --disconnect-after-job
      - --hooks-path=/hooks
      - --tags=queue=cuda,cap=sm_75,gpu=rtx5000,cap=recent,shared=true
      - --name=gpuci.18
      - --priority=3
    volumes:
      - /home/buildkite/gpuci.18:/root
