# an Intel NUC 11 (NUC11PAHi7) containing a i7-1165G7 (8 threads) with 32GiB RAM

services:
  buildkite:
    hostname: sagittarius.maleadt.net
    build:
      context: ../../image/
      args:
        base: docker.io/library/gcc
    devices:
      - "/dev/dri:/dev/dri"
    environment:
      JULIA_CPU_THREADS: 4
      NEO_CACHE_MAX_SIZE: 17179869184
    env_file: ../token.env
    command:
      - start
      - --disconnect-after-job
      - --hooks-path=/hooks
      - --tags=queue=oneapi
      - --name=sagittarius.maleadt.net
    volumes:
      - /home/buildkite:/root
    # Jobs run on an isolated VLAN that can only reach the internet. The network
    # is a macvlan created on the host (see README.md); if it is missing, the
    # agent refuses to start.
    networks:
      julia:
        ipv4_address: 192.168.4.10
    dns:
      - 192.168.4.1
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

networks:
  julia:
    external: true
